[package]
name = "idf-remote"
version = "0.2.0"
edition = "2024"
description = "Remote firmware flashing, serial monitoring, and application control for ESP boards"
license = "Apache-2.0"
repository = "https://github.com/Heap-Hop/idf-remote"
readme = "README.md"

keywords = ["esp32", "esp-idf", "embedded", "serial", "flashing"]
categories = ["command-line-utilities", "embedded", "development-tools"]


[[bin]]
name = "idfr"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:espflash", "dep:serialport", "dep:clap", "dep:crossterm", "dep:ctrlc", "dep:reqwest", "dep:toml", "dep:directories", "dep:object", "dep:esp-idf-part"]
android-usb = ["dep:nusb", "dep:espflash-android", "dep:serialport"]

[[example]]
name = "embedded_gateway"
required-features = ["desktop"]

[[test]]
name = "cli"
required-features = ["desktop"]

[dependencies]
esp-idf-part = { version = "=0.6.0", optional = true }
toml = { version = "1.1", optional = true }
directories = { version = "6", optional = true }
object = { version = "0.39", optional = true, default-features = false, features = ["read", "std", "elf"] }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
clap = { version = "4.5", optional = true, features = ["derive"] }
crossterm = { version = "0.29.0", optional = true, default-features = false, features = [
    "windows",
] }
ctrlc = { version = "3.4", optional = true }
espflash = { version = "=4.5.0", optional = true, default-features = false, features = [
    "serialport",
] }
regex = "1.11"
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "blocking",
    "json",
    "multipart",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.7", optional = true, default-features = false }
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "signal",
    "fs",
    "io-util",
    "macros",
] }

nusb = { version = "0.2.7", optional = true }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
espflash-android = { package = "espflash", git = "https://github.com/Heap-Hop/espflash", rev = "532cd5918081f471e5f18ae8f40cf8eb079f1fce", optional = true, default-features = false, features = ["custom-transport"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
