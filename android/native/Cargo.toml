[package]
name = "idf-remote-android"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
idf-remote = { path = "../..", default-features = false, features = ["android-usb"] }
jni = "0.21"
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
axum = "0.8"
