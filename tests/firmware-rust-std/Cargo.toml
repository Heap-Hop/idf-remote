[package]
name = "idfr-fixture-std"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
esp-idf-sys = { version = "=0.36.1", features = ["binstart"] }

[build-dependencies]
embuild = { version = "=0.33.1", features = ["espidf"] }

[profile.release]
opt-level = "s"
debug = 2
